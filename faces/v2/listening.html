<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabbie - Listening</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .scene {
    position: relative;
    width: 500px;
    height: 500px;
  }

  /* ===== FACE CONTAINER (perspectiva 3D virado de lado) ===== */
  .face-wrapper {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    perspective: 500px;
  }

  .face {
    transform: rotateY(25deg) rotateZ(-3deg);
    transform-style: preserve-3d;
    animation: listen-sway 4s ease-in-out infinite;
  }

  @keyframes listen-sway {
    0%, 100% { transform: rotateY(25deg) rotateZ(-3deg) translateY(0); }
    50% { transform: rotateY(22deg) rotateZ(-1deg) translateY(-4px); }
  }

  /* ===== ORELHA (lado esquerdo, virado pro som) ===== */
  .ear {
    position: absolute;
    top: 38px;
    left: -18px;
    filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.15));
  }

  /* ===== ONDAS DE SOM LATERAL (entrando pela esquerda) ===== */
  .sound-lateral {
    position: absolute;
    top: 50%;
    left: -55px;
    transform: translateY(-50%);
    pointer-events: none;
  }

  .sound-arc {
    position: absolute;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    border: 2px solid rgba(255, 200, 0, 0.35);
    border-left: none;
    border-radius: 0 50% 50% 0;
    opacity: 0;
  }

  .sound-arc:nth-child(1) {
    width: 8px; height: 18px;
    animation: arc-pulse 1.8s ease-out infinite 0s;
  }
  .sound-arc:nth-child(2) {
    width: 12px; height: 28px;
    animation: arc-pulse 1.8s ease-out infinite 0.3s;
  }
  .sound-arc:nth-child(3) {
    width: 16px; height: 38px;
    animation: arc-pulse 1.8s ease-out infinite 0.6s;
  }
  .sound-arc:nth-child(4) {
    width: 20px; height: 48px;
    animation: arc-pulse 1.8s ease-out infinite 0.9s;
  }

  @keyframes arc-pulse {
    0% { opacity: 0; transform: translateY(-50%) translateX(-30px) scale(1.2); }
    20% { opacity: 0.6; }
    70% { opacity: 0.4; }
    100% { opacity: 0; transform: translateY(-50%) translateX(15px) scale(0.5); }
  }

  /* ===== OLHOS ===== */
  .eyes {
    display: flex;
    gap: 80px;
    position: relative;
  }

  .eye {
    width: 72px;
    height: 100px;
    background: #fff;
    border-radius: 38px;
    position: relative;
    box-shadow: 0 0 30px rgba(255,255,255,0.3), 0 0 60px rgba(255,255,255,0.1);
    overflow: hidden;
  }

  /* Olho mais distante fica ligeiramente menor (perspectiva) */
  .eye-far {
    width: 62px;
    height: 88px;
    border-radius: 34px;
  }

  /* Pálpebra superior */
  .eye::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 0%;
    background: #000;
    z-index: 2;
    animation: eyelid-top 5s ease-in-out infinite;
  }

  /* Pálpebra inferior */
  .eye::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 0%;
    background: #000;
    z-index: 2;
    animation: eyelid-bottom 5s ease-in-out infinite;
  }

  @keyframes eyelid-top {
    0%, 22%, 26%, 100% { height: 0%; }
    23.5%, 24.5% { height: 52%; }
  }

  @keyframes eyelid-bottom {
    0%, 22%, 26%, 100% { height: 0%; }
    23.5%, 24.5% { height: 52%; }
  }

  /* ===== SORRISO ===== */
  .mouth {
    width: 45px;
    height: 0;
    margin: 22px auto 0;
    position: relative;
  }

  .mouth svg {
    display: block;
    overflow: visible;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.2));
  }

  /* ===== ANTENA AMARELA ===== */
  .antenna {
    position: absolute;
    top: -65px;
    left: 45%;
    transform: translateX(-50%);
    transform-origin: bottom center;
  }

  .antenna-ball {
    width: 20px;
    height: 20px;
    background: radial-gradient(circle at 40% 35%, #fff6d0, #ffcc00 40%, #cc8800 100%);
    border-radius: 50%;
    position: relative;
    left: 50%;
    transform: translateX(-50%);
    margin-bottom: -3px;
    box-shadow:
      0 0 14px rgba(255, 200, 0, 0.9),
      0 0 35px rgba(255, 200, 0, 0.5),
      0 0 70px rgba(255, 180, 0, 0.25);
    animation: yellow-glow 2s ease-in-out infinite;
  }

  @keyframes yellow-glow {
    0%, 100% {
      box-shadow:
        0 0 14px rgba(255, 200, 0, 0.9),
        0 0 35px rgba(255, 200, 0, 0.5),
        0 0 70px rgba(255, 180, 0, 0.25);
    }
    50% {
      box-shadow:
        0 0 20px rgba(255, 210, 0, 1),
        0 0 50px rgba(255, 200, 0, 0.7),
        0 0 90px rgba(255, 180, 0, 0.35),
        0 0 120px rgba(255, 160, 0, 0.15);
    }
  }

  .antenna-curve {
    position: relative;
  }

  /* ===== ONDAS SONORAS ===== */
  .sound-waves {
    position: absolute;
    top: -2px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
  }

  .wave {
    position: absolute;
    border: 2px solid rgba(255, 200, 0, 0.3);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
  }

  .wave:nth-child(1) {
    width: 30px; height: 30px;
    animation: wave-expand 2.5s ease-out infinite 0s;
  }
  .wave:nth-child(2) {
    width: 30px; height: 30px;
    animation: wave-expand 2.5s ease-out infinite 0.6s;
  }
  .wave:nth-child(3) {
    width: 30px; height: 30px;
    animation: wave-expand 2.5s ease-out infinite 1.2s;
  }
  .wave:nth-child(4) {
    width: 30px; height: 30px;
    animation: wave-expand 2.5s ease-out infinite 1.8s;
  }

  @keyframes wave-expand {
    0% {
      width: 30px; height: 30px;
      opacity: 0.5;
    }
    100% {
      width: 100px; height: 100px;
      opacity: 0;
    }
  }

  /* ===== NOTAS MUSICAIS ===== */
  .notes {
    position: absolute;
    top: -10px;
    left: 55%;
    pointer-events: none;
  }

  .note {
    position: absolute;
    font-size: 16px;
    color: rgba(255, 210, 80, 0.8);
    opacity: 0;
    text-shadow: 0 0 6px rgba(255, 200, 0, 0.5);
  }

  .note:nth-child(1) {
    font-size: 14px;
    animation: note-float 3.5s ease-in-out infinite 0s;
  }
  .note:nth-child(2) {
    font-size: 18px;
    animation: note-float 4s ease-in-out infinite 1s;
  }
  .note:nth-child(3) {
    font-size: 12px;
    animation: note-float 3.8s ease-in-out infinite 2s;
  }

  @keyframes note-float {
    0% {
      opacity: 0;
      transform: translate(0, 0) rotate(-10deg);
    }
    15% {
      opacity: 0.8;
    }
    50% {
      opacity: 0.6;
      transform: translate(15px, -30px) rotate(10deg);
    }
    85% {
      opacity: 0.15;
    }
    100% {
      opacity: 0;
      transform: translate(25px, -55px) rotate(20deg);
    }
  }

  /* ===== GLOW AMBIENTE ===== */
  .ambient-glow {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 300px;
    height: 200px;
    background: radial-gradient(ellipse, rgba(255, 200, 0, 0.03) 0%, transparent 70%);
    pointer-events: none;
    animation: ambient-breathe 3s ease-in-out infinite;
  }

  @keyframes ambient-breathe {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="ambient-glow"></div>
  <div class="face-wrapper">
  <div class="face">
    <!-- Orelha (lado esquerdo, pequena) -->
    <div class="ear">
      <svg width="14" height="26" viewBox="0 0 30 55">
        <path d="M 25 10 Q 2 15, 2 28 Q 2 42, 25 45"
              stroke="rgba(255,255,255,0.35)" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M 22 16 Q 10 20, 10 28 Q 10 37, 22 40"
              stroke="rgba(255,255,255,0.2)" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Ondas de som entrando pela lateral esquerda -->
    <div class="sound-lateral">
      <div class="sound-arc"></div>
      <div class="sound-arc"></div>
      <div class="sound-arc"></div>
      <div class="sound-arc"></div>
    </div>

    <!-- Antena amarela -->
    <div class="antenna">
      <div class="antenna-ball"></div>
      <svg width="30" height="55" viewBox="0 0 30 55" class="antenna-curve" style="overflow:visible;">
        <path d="M 15 0 Q 16 20, 12 40 Q 10 50, 15 55"
              stroke="rgba(180,150,50,0.6)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </svg>
      <!-- Ondas sonoras -->
      <div class="sound-waves">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
      </div>
      <!-- Notas musicais -->
      <div class="notes">
        <span class="note">&#9835;</span>
        <span class="note">&#9834;</span>
        <span class="note">&#9833;</span>
      </div>
    </div>

    <!-- Olhos -->
    <div class="eyes">
      <div class="eye eye-far"></div>
      <div class="eye"></div>
    </div>

    <!-- Boca -->
    <div class="mouth">
      <svg width="45" height="12" viewBox="0 0 45 12">
        <path d="M 5 2 Q 22 14, 40 2" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
  </div>
</div>

<script>
  const face = document.querySelector('.face');
  const antenna = document.querySelector('.antenna');

  // Micro-variação no rotateY como se estivesse ajustando a "orelha"
  let yRot = 25;
  let yRotTarget = 25;
  let yRotVelocity = 0;

  function updateTilt() {
    if (Math.random() < 0.012) {
      yRotTarget = 20 + Math.random() * 12; // entre 20 e 32 graus
    }

    const spring = 0.003;
    const damping = 0.97;

    yRotVelocity += (yRotTarget - yRot) * spring;
    yRotVelocity *= damping;
    yRot += yRotVelocity;

    const baseY = Math.sin(Date.now() * 0.0008) * 3;
    const zRot = Math.sin(Date.now() * 0.0005) * 2 - 2;

    face.style.transform = `rotateY(${yRot}deg) rotateZ(${zRot}deg) translateY(${baseY}px)`;
    requestAnimationFrame(updateTilt);
  }

  // Antena reagindo ao "som" com balanço
  let antennaAngle = 0;
  let antennaVelocity = 0;
  let antennaTarget = 0;

  function updateAntenna() {
    if (Math.random() < 0.025) {
      antennaTarget = (Math.random() - 0.5) * 10;
    }

    const spring = 0.008;
    const damping = 0.95;

    antennaVelocity += (antennaTarget - antennaAngle) * spring;
    antennaVelocity *= damping;
    antennaAngle += antennaVelocity;

    antenna.style.transform = `translateX(-50%) rotate(${antennaAngle}deg)`;
    requestAnimationFrame(updateAntenna);
  }

  // Piscar aleatório
  const eyes = document.querySelectorAll('.eye');
  function randomBlink() {
    eyes.forEach(eye => {
      const top = eye.querySelector(':before') || eye;
      eye.style.setProperty('--blink', '1');
    });

    // Reset CSS animation
    eyes.forEach(eye => {
      eye.style.animation = 'none';
      eye.offsetHeight;
      eye.style.animation = '';
    });

    const next = 3500 + Math.random() * 4000;
    setTimeout(randomBlink, next);
  }

  setTimeout(() => {
    updateTilt();
    updateAntenna();
    randomBlink();
  }, 500);
</script>

</body>
</html>
