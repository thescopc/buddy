<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabbie - Angry</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .scene {
    position: relative;
    width: 500px;
    height: 500px;
  }

  /* ===== GLOW AMBIENTE VERMELHO ===== */
  .ambient-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -45%);
    width: 350px;
    height: 250px;
    background: radial-gradient(ellipse, rgba(255, 30, 30, 0.06) 0%, transparent 70%);
    pointer-events: none;
    animation: ambient-pulse 2s ease-in-out infinite;
  }

  @keyframes ambient-pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  /* ===== FACE CONTAINER ===== */
  .face {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: angry-tremble 0.15s linear infinite;
  }

  @keyframes angry-tremble {
    0% { transform: translate(-50%, -50%) translate(0, 0); }
    25% { transform: translate(-50%, -50%) translate(-1.2px, 0.5px); }
    50% { transform: translate(-50%, -50%) translate(1px, -0.8px); }
    75% { transform: translate(-50%, -50%) translate(-0.8px, -0.5px); }
    100% { transform: translate(-50%, -50%) translate(0.5px, 0.8px); }
  }

  /* ===== OLHOS (meia-lua com raiva) ===== */
  .eyes {
    display: flex;
    gap: 30px;
    position: relative;
  }

  .eye-angry {
    width: 72px;
    height: 50px;
    position: relative;
    overflow: visible;
  }

  .eye-angry svg {
    overflow: visible;
    filter: drop-shadow(0 0 8px rgba(255, 80, 80, 0.6)) drop-shadow(0 0 20px rgba(255, 50, 50, 0.3));
  }

  /* ===== BOCA (carranca com dentes) ===== */
  .mouth {
    width: 65px;
    margin: 8px auto 0;
    position: relative;
  }

  .mouth svg {
    display: block;
    overflow: visible;
    filter: drop-shadow(0 0 6px rgba(255, 80, 80, 0.4)) drop-shadow(0 0 15px rgba(255, 50, 50, 0.2));
  }

  /* ===== ANTENA VERMELHA ===== */
  .antenna {
    position: absolute;
    top: -65px;
    left: 45%;
    transform: translateX(-50%);
    transform-origin: bottom center;
  }

  .antenna-ball {
    width: 20px;
    height: 20px;
    background: radial-gradient(circle at 40% 35%, #ff8888, #ff2244 40%, #aa0022 100%);
    border-radius: 50%;
    position: relative;
    left: 50%;
    transform: translateX(-50%);
    margin-bottom: -3px;
    box-shadow:
      0 0 12px rgba(255, 40, 60, 0.9),
      0 0 30px rgba(255, 40, 60, 0.6),
      0 0 60px rgba(255, 20, 40, 0.3);
    animation: red-glow-pulse 1.5s ease-in-out infinite;
  }

  @keyframes red-glow-pulse {
    0%, 100% {
      box-shadow:
        0 0 12px rgba(255, 40, 60, 0.9),
        0 0 30px rgba(255, 40, 60, 0.6),
        0 0 60px rgba(255, 20, 40, 0.3);
    }
    50% {
      box-shadow:
        0 0 20px rgba(255, 40, 60, 1),
        0 0 45px rgba(255, 40, 60, 0.8),
        0 0 80px rgba(255, 20, 40, 0.4),
        0 0 110px rgba(255, 0, 30, 0.2);
    }
  }

  .antenna-curve {
    position: relative;
  }

  /* ===== SPARKS / FAÍSCAS ===== */
  .sparks {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
  }

  .spark {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #ff4466;
    border-radius: 50%;
    opacity: 0;
    box-shadow: 0 0 4px rgba(255, 68, 102, 0.9);
  }

  .spark:nth-child(1) {
    animation: spark-fly 1.8s ease-out infinite 0s;
  }
  .spark:nth-child(2) {
    animation: spark-fly 2.1s ease-out infinite 0.4s;
  }
  .spark:nth-child(3) {
    animation: spark-fly 1.6s ease-out infinite 0.9s;
  }
  .spark:nth-child(4) {
    animation: spark-fly 2.4s ease-out infinite 1.3s;
  }
  .spark:nth-child(5) {
    animation: spark-fly 1.9s ease-out infinite 0.6s;
  }
  .spark:nth-child(6) {
    animation: spark-fly 2.2s ease-out infinite 1.7s;
  }

  @keyframes spark-fly {
    0% {
      opacity: 0;
      transform: translate(0, 0) scale(1);
    }
    10% {
      opacity: 1;
    }
    100% {
      opacity: 0;
      transform: translate(var(--sx), var(--sy)) scale(0);
    }
  }

  .spark:nth-child(1) { --sx: -18px; --sy: -25px; }
  .spark:nth-child(2) { --sx: 22px; --sy: -20px; }
  .spark:nth-child(3) { --sx: -12px; --sy: -30px; }
  .spark:nth-child(4) { --sx: 15px; --sy: -28px; }
  .spark:nth-child(5) { --sx: -25px; --sy: -15px; }
  .spark:nth-child(6) { --sx: 8px; --sy: -35px; }

  /* ===== VEIAS DE RAIVA (pulse nas laterais) ===== */
  .vein-pulse {
    position: absolute;
    width: 20px;
    height: 20px;
    border-top: 3px solid rgba(255, 60, 60, 0.7);
    border-right: 3px solid rgba(255, 60, 60, 0.7);
    border-radius: 0 5px 0 0;
    opacity: 0;
    animation: vein-pop 3s ease-in-out infinite;
  }

  .vein-pulse::before {
    content: '';
    position: absolute;
    width: 10px;
    height: 10px;
    border-top: 2.5px solid rgba(255, 60, 60, 0.5);
    border-right: 2.5px solid rgba(255, 60, 60, 0.5);
    border-radius: 0 4px 0 0;
    top: 3px;
    left: 3px;
  }

  .vein-left {
    top: -15px;
    left: -30px;
    transform: rotate(-20deg);
    animation-delay: 0.5s;
  }

  .vein-right {
    top: -15px;
    right: -30px;
    transform: rotate(70deg) scaleX(-1);
  }

  @keyframes vein-pop {
    0%, 30%, 100% { opacity: 0; transform: scale(0.7); }
    10%, 20% { opacity: 0.9; transform: scale(1); }
    15% { opacity: 1; transform: scale(1.1); }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="ambient-glow"></div>
  <div class="face">
    <!-- Antena vermelha -->
    <div class="antenna">
      <div class="antenna-ball"></div>
      <svg width="30" height="55" viewBox="0 0 30 55" class="antenna-curve" style="overflow:visible;">
        <path d="M 15 0 Q 16 20, 12 40 Q 10 50, 15 55"
              stroke="rgba(180,40,40,0.7)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </svg>
      <!-- Faíscas -->
      <div class="sparks">
        <div class="spark"></div>
        <div class="spark"></div>
        <div class="spark"></div>
        <div class="spark"></div>
        <div class="spark"></div>
        <div class="spark"></div>
      </div>
    </div>

    <!-- Veias de raiva -->
    <div class="vein-pulse vein-right"></div>

    <!-- Olhos com raiva: meias-luas preenchidas + risco diagonal sobre cada olho -->
    <div class="eyes">
      <!-- Olho esquerdo -->
      <div class="eye-angry">
        <svg width="75" height="55" viewBox="0 0 75 55">
          <defs>
            <clipPath id="lid-left">
              <polygon points="0,18  75,34  75,55  0,55"/>
            </clipPath>
          </defs>
          <ellipse cx="37" cy="32" rx="32" ry="20"
                   fill="rgba(255,180,180,0.95)"
                   clip-path="url(#lid-left)"/>
          <!-- Risco diagonal (sobrancelha) sobre o olho -->
          <line x1="2" y1="16" x2="73" y2="32"
                stroke="rgba(255,180,180,0.95)" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- Olho direito (espelhado) -->
      <div class="eye-angry">
        <svg width="75" height="55" viewBox="0 0 75 55">
          <defs>
            <clipPath id="lid-right">
              <polygon points="0,34  75,18  75,55  0,55"/>
            </clipPath>
          </defs>
          <ellipse cx="37" cy="32" rx="32" ry="20"
                   fill="rgba(255,180,180,0.95)"
                   clip-path="url(#lid-right)"/>
          <!-- Risco diagonal (sobrancelha) espelhado -->
          <line x1="2" y1="32" x2="73" y2="16"
                stroke="rgba(255,180,180,0.95)" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- Boca: carranca invertida com dentes cerrados -->
    <div class="mouth">
      <svg width="70" height="24" viewBox="0 0 70 24">
        <!-- Lábio superior curvado pra cima (raiva) -->
        <path d="M 5 18 Q 35 2, 65 18" stroke="none" fill="none"/>
        <!-- Forma preenchida: bem curvada pra cima = carranca forte -->
        <path d="M 5 22 Q 35 -4, 65 22 Q 35 28, 5 22 Z"
              fill="rgba(255,180,180,0.95)"/>
        <!-- Linha dos dentes no meio -->
        <path d="M 12 19 Q 35 6, 58 19" stroke="#000" stroke-width="1.2" fill="none"/>
        <!-- Separação dos dentes - cima -->
        <line x1="22" y1="11" x2="22" y2="17" stroke="rgba(0,0,0,0.35)" stroke-width="0.8"/>
        <line x1="35" y1="7" x2="35" y2="13" stroke="rgba(0,0,0,0.35)" stroke-width="0.8"/>
        <line x1="48" y1="11" x2="48" y2="17" stroke="rgba(0,0,0,0.35)" stroke-width="0.8"/>
        <!-- Separação dos dentes - baixo -->
        <line x1="25" y1="19" x2="25" y2="23" stroke="rgba(0,0,0,0.3)" stroke-width="0.8"/>
        <line x1="35" y1="14" x2="35" y2="20" stroke="rgba(0,0,0,0.3)" stroke-width="0.8"/>
        <line x1="45" y1="19" x2="45" y2="23" stroke="rgba(0,0,0,0.3)" stroke-width="0.8"/>
      </svg>
    </div>
  </div>
</div>

<script>
  // Tremor com intensidade variável
  const face = document.querySelector('.face');
  let intensity = 1;
  let targetIntensity = 1;

  function updateTremble() {
    // Varia a intensidade do tremor
    if (Math.random() < 0.02) {
      targetIntensity = 0.5 + Math.random() * 2;
    }
    intensity += (targetIntensity - intensity) * 0.05;

    const x = (Math.random() - 0.5) * 2.5 * intensity;
    const y = (Math.random() - 0.5) * 1.5 * intensity;

    face.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
    requestAnimationFrame(updateTremble);
  }

  // Antena com balanço agressivo
  const antenna = document.querySelector('.antenna');
  let antennaAngle = 0;
  let antennaVelocity = 0;
  let antennaTarget = 0;

  function updateAntenna() {
    // Movimentos bruscos
    if (Math.random() < 0.03) {
      antennaTarget = (Math.random() - 0.5) * 15;
    }

    const spring = 0.02;
    const damping = 0.92;

    antennaVelocity += (antennaTarget - antennaAngle) * spring;
    antennaVelocity *= damping;
    antennaAngle += antennaVelocity;

    antenna.style.transform = `translateX(-50%) rotate(${antennaAngle}deg)`;
    requestAnimationFrame(updateAntenna);
  }

  setTimeout(() => {
    updateTremble();
    updateAntenna();
  }, 300);
</script>

</body>
</html>
